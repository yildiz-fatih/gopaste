name: CI/CD Pipeline

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Run tests
              run: go test ./...

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:latest

            - name: Deploy to the droplet
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H 64.227.120.146 >> ~/.ssh/known_hosts
                  ssh -i ~/.ssh/deploy_key fatih@64.227.120.146 "cd gopaste && git pull && docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d"
